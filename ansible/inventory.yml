all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: "{{ SSH_KEY_PATH }}"
    ansible_python_interpreter: /usr/bin/python3

  hosts:
    monitoring:
      ansible_host: "{{ MONITORING_IP }}"

    public:
      ansible_host: "{{ PUBLIC_IP }}"
      ansible_ssh_common_args: "-o ProxyCommand='ssh -i {{ SSH_KEY_PATH }} -o StrictHostKeyChecking=no -W %h:%p ubuntu@{{ MONITORING_IP }}'"

    private:
      ansible_host: "{{ PRIVATE_IP }}"
      ansible_ssh_common_args: "-o ProxyCommand='ssh -i {{ SSH_KEY_PATH }} -o StrictHostKeyChecking=no -W %h:%p ubuntu@{{ MONITORING_IP }}'"

    internal:
      ansible_host: "{{ INTERNAL_IP }}"
      ansible_ssh_common_args: "-o ProxyCommand='ssh -i {{ SSH_KEY_PATH }} -o StrictHostKeyChecking=no -W %h:%p ubuntu@{{ MONITORING_IP }}'"