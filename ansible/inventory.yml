all:
  hosts:
    monitoring:
      ansible_host: "{{ MONITORING_IP }}"
    public:
      ansible_host: "{{ PUBLIC_IP }}"
      ansible_user: ubuntu
      ansible_ssh_private_key_file: "{{ SSH_KEY_PATH }}"
    private:
      ansible_host: "{{ PRIVATE_IP }}"
      ansible_user: ubuntu
      ansible_ssh_private_key_file: "{{ SSH_KEY_PATH }}"
    internal:
      ansible_host: "{{ INTERNAL_IP }}"
      ansible_user: ubuntu
      ansible_ssh_private_key_file: "{{ SSH_KEY_PATH }}"