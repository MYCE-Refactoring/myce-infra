- name : Install nginx in nat
  vars_files:
    - vars/main.yml
  hosts:
    - public
  become: yes
  roles:
    - environment/nginx

- name: Configure NAT instance
  hosts: monitoring
  become: yes
  roles:
    - environment/nat

- name: Install docker in private
  hosts: 
    - public
    - monitoring
    - private
    - internal
  become: yes
  roles:
    - environment/docker

- name: Create databases on RDS
  hosts: monitoring
  become: yes
  vars:
    rds_host: "{{ RDS_HOST }}"
    rds_user: "{{ RDS_USER }}"
    rds_password: "{{ RDS_PASSWORD }}"
    databases:
      - myce_core
      - myce_payment
      - myce_notification
  roles:
    - environment/database